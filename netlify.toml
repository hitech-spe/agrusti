[build]
  publish = "dist/agrusti/browser"
  command = "npm run build"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_VERSION = "22"

# Canonical 301 Redirections to apex https://antonioagrustisrls.com
[[redirects]]
  from = "https://www.antonioagrustisrls.com/*"
  to = "https://antonioagrustisrls.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.antonioagrustisrls.com/*"
  to = "https://antonioagrustisrls.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://antonioagrustisrls.com/*"
  to = "https://antonioagrustisrls.com/:splat"
  status = 301
  force = true

# Fallback for Angular SPA Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers for Netlify deployment
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=86400"
